 
services:
  db:
    image: postgres:15
    container_name: fhir-db
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # create a database hapi on container startup
    # https://stackoverflow.com/questions/70689893/postgres-docker-create-database-on-startup
    command: ["postgres", "-c", "fsync=off"]

  fhir:
    container_name: fhir
    image: "hapiproject/hapi:latest"
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/hapi
      - SPRING_DATASOURCE_USERNAME=hapi
      - SPRING_DATASOURCE_PASSWORD=hapi
    configs:
      - source: hapi
        target: /app/config/application.yaml

volumes:
  db_data:

configs:
  hapi:
     file: ./hapi.application.yaml