# ============================================================================
# MÓDULO: Gateway / Proxy Inverso (Nginx Principal)
# PROYECTO: SIGREF (Sistema de Gestión y Referencia)
# ----------------------------------------------------------------------------
# AUTORES: 
#   - Erick Marley -> Diseño Inicial y Orquestación de Servicios
#   - @TETvega (Héctor Rene Martínez Vega) -> Arquitectura de Red y Seguridad
# CO-AUTOR DE OPTIMIZACIÓN: 
#   - Gemini 3 Flash (Google AI) -> Tuning de WebSockets y Buffering para Aspire
# ----------------------------------------------------------------------------
# PROPÓSITO: Punto de entrada único para el ecosistema SIGREF. Gestiona
#            el balanceo de carga, terminación de tráfico y ruteo interno.
#            Incluye soporte para Worker de tareas asíncronas (Hangfire).
# ============================================================================

# Definiciones de Upstream para balanceo y resolución de nombres Docker
# ----------------------------------------------------------------------------
upstream frontend_backend {
    server frontend:80;
    keepalive 32; # Mantiene conexiones abiertas para mejorar latencia
}

upstream sigref_api_backend {
    server sigref-api:8080;
    keepalive 32;
}

upstream keycloak_backend {
    server keycloak:8080;
}

upstream dashboard_backend {
    server env-dashboard:18888;
}

#Cuando Hanfire sea activado como contenedor
#Upstream dedicado para el Worker de procesos en segundo plano
# upstream hangfire_worker_backend {
#     server sigref-worker:8080;
#     keepalive 8;
# }

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ------------------------------------------------------------------------
    # SEGURIDAD GLOBAL
    # ------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamaño máximo de subida (Ajustado para documentos en SIGREF)
    client_max_body_size 50M;

    # Configuración de Proxy Headers (Fragmento reutilizable)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # ------------------------------------------------------------------------
    # 1. FRONTEND APPLICATION
    # ------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ------------------------------------------------------------------------
    # 2. SIGREF API (.NET 9)
    # ------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://sigref_api_backend;
        
        # Optimizaciones para APIs de alta carga
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Soporte para compresión de respuesta API
        gzip on;
        gzip_types application/json;
    }

    # ------------------------------------------------------------------------
    # 3. KEYCLOAK AUTHENTICATION
    # ------------------------------------------------------------------------
    location /auth/ {
        proxy_pass http://keycloak_backend/auth/;
        
        # IMPORTANTE: Keycloak usa cookies grandes y tokens pesados.
        # Aumentamos los buffers para evitar errores 502 (Bad Gateway).
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        proxy_connect_timeout 90s;
        proxy_read_timeout 90s;
    }

    # ------------------------------------------------------------------------
    # 4. HANGFIRE DASHBOARD (Worker Independiente)
    # ------------------------------------------------------------------------
    # location /hangfire {
    #     proxy_pass http://hangfire_worker_backend/hangfire;
        
    #     # Configuraciones necesarias para el Dashboard de Hangfire
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
        
    #     # Desactivamos buffering para ver actualizaciones de tareas en tiempo real
    #     proxy_buffering off;
        
    #     # Timeouts extendidos para monitoreo de jobs
    #     proxy_connect_timeout 100s;
    #     proxy_read_timeout 100s;
    # }

    # ------------------------------------------------------------------------
    # 5. ASPIRE DASHBOARD (Con soporte WebSocket)
    # ------------------------------------------------------------------------
    location ~ ^/dashboard/(.*)$ {
        proxy_pass http://dashboard_backend/$1$is_args$args;
        
        # Configuración obligatoria para WebSockets (Señales de Aspire)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Los timeouts largos previenen que el dashboard se desconecte solo
        proxy_connect_timeout 1d;
        proxy_send_timeout 1d;
        proxy_read_timeout 1d;
    }
    
    location = /dashboard {
        return 301 /dashboard/;
    }

    # ------------------------------------------------------------------------
    # 6. MONITOREO Y SALUD
    # ------------------------------------------------------------------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "SIGREF System: healthy\n";
    }
}