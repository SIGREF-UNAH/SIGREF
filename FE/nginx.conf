# ============================================================================
# MÓDULO: Configuración de Servidor Web (Nginx)
# PROYECTO: SIGREF (Sistema de Gestión y Referencia)
# ----------------------------------------------------------------------------
# AUTOR (GitHub): 
#   - @TETvega (Héctor Rene Martínez Vega) -> Arquitectura de Entrega
# CO-AUTOR DE OPTIMIZACIÓN: 
#   - Gemini 3 Flash (Google AI) -> Directivas de Cache e Inmunidad de Assets
# ----------------------------------------------------------------------------
# PROPÓSITO: Servidor de alto rendimiento para SPA, optimizado para Vite,
#            con compresión dinámica y políticas de seguridad estrictas.
# ============================================================================

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Directorio raíz donde Docker copia el build (dist)
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------------
    # 1. OPTIMIZACIÓN: Compresión Gzip
    # Reduce el ancho de banda transmitiendo archivos comprimidos.
    # ------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6; # Balance ideal entre CPU y compresión
    gzip_min_length 256; # Comprimir incluso archivos pequeños
    gzip_types 
        text/plain 
        text/css 
        text/javascript 
        application/javascript 
        application/x-javascript 
        application/json 
        application/xml 
        application/rss+xml 
        image/svg+xml;

    # ------------------------------------------------------------------------
    # 2. SEGURIDAD: Cabeceras Globales (Hardening)
    # ------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;         # Evita Clickjacking
    add_header X-Content-Type-Options "nosniff" always;    # Evita MIME-type sniffing
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    # Content Security Policy (Opcional - Ajustar según necesidades de APIs externas)
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    # ------------------------------------------------------------------------
    # 3. RUTEO: Soporte para SPA (Single Page Application)
    # Importante: Permite que Vite/React/Vue manejen el historial del navegador.
    # ------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # El index.html NUNCA debe ser cacheado para poder desplegar versiones nuevas
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    # ------------------------------------------------------------------------
    # 4. RENDIMIENTO: Cache de Assets Inmutables (Vite)
    # Vite genera hashes únicos (ej. index-d82f.js). Estos pueden vivir años en cache.
    # ------------------------------------------------------------------------
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------------
    # 5. MANEJO DE ERRORES
    # ------------------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
