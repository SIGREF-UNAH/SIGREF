sonar.projectBaseDir=.
sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/api/generated/**,docs/**,documentation/**,node_modules/**,dist/**,build/**,coverage/**,**/*.min.js,**/*.min.css,package-lock.json
sonar.coverage.exclusions=src/api/generated/**,src/**/*.test.*,src/**/*.spec.*,tests/**,scripts/**,vite.config.*,eslint.config.*,orval.config.ts
sonar.cpd.exclusions=src/api/generated/**,src/**/*.test.*,src/**/*.spec.*,tests/**
