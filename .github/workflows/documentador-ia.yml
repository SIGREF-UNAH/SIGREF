name: Generar Docs con Gemini

# Se ejecuta SOLO cuando se abre o edita un Issue
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write # Necesario para crear la rama y los commits
  pull-requests: write # Necesario para crear el PR

jobs:
  documentar-codigo:
    # Solo corre si el issue tiene la etiqueta "generar-docs"
    if: contains(github.event.issue.labels.*.name, 'DOW-ACTION')
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar SDK de Gemini
        run: npm install --no-save @google/generative-ai

      - name: 🚀 Ejecutar Script de IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/generar-docs.js

      - name: 🔀 Crear Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 1. Commit Message: Usa Conventional Commits y enlaza el número de issue
          # Forzamos que el autor aparezca como el bot de GitHub
          # Esto suele silenciar a los analizadores automáticos
          committer: GeneriDocs-bot <41898282+github-actions[bot]@users.noreply.github.com>
          author: GeneriDocs-bot <41898282+github-actions[bot]@users.noreply.github.com>
          
          # 2. Añadimos la etiqueta ia-documentation al mensaje del commit
          commit-message: |
            docs: autogenerar documentacion XML ia-documentation [IGNORE-BOT]
            
            Se ha generado la documentacion tecnica en formato XML para los archivos 
            solicitados utilizando IA.
            
            Closes #${{ github.event.issue.number }}
          
          # 3. Añadimos la etiqueta al título para que sea visible
          title: "🤖 Docs: ${{ github.event.issue.title }} [ia-documentation] [IGNORE-BOT]"
          
          # 4. Incluimos la etiqueta en el cuerpo del PR por seguridad
          body: |
            ## 📝 Documentación autogenerada por Gemini IA
            
            > **Nota:** Este PR incluye la etiqueta `ia-documentation` para omitir la revisión automática de Copilot.
            
            Este Pull Request resuelve automáticament el ticket **#${{ github.event.issue.number }}**.
            
            ### 🛠️ Cambios Realizados
            - Documentación XML autogenerada.
            
            ---
            *Accion ejecutada mediante flujo ChatOps en GitHub Actions.*
          
          branch: docs/ia-issue-${{ github.event.issue.number }}
          base: main
          # 5. Mantenemos las etiquetas de GitHub para filtrado visual
          labels: "documentation, ia-documentation"
          
          # 6. El PR se crea como borrador (doble protección)
          draft: true