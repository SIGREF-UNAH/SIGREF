name: "Actor 1: Enqueue Documentation"

on:
  # Disparador automático al etiquetar una Issue
  issues:
    types: [labeled]
  
  # Disparador manual mediante botón en GitHub Actions
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Número de la Issue asociada'
        required: true
        default: '0'
      issue_body:
        description: 'Cuerpo (debe incluir "Archivo: ruta/del/archivo")'
        required: true

jobs:
  enqueue:
    # Se ejecuta si la etiqueta es 'generar-docs' o si es manual
    if: github.event.label.name == 'generar-docs' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 📝 Registrar en Cola (ai_queue)
        run: |
          mkdir -p .github/ai_queue
          
          # Detectar origen de datos (Manual vs Automático)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BODY="${{ github.event.inputs.issue_body }}"
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
          else
            BODY="${{ github.event.issue.body }}"
            ISSUE_NUM="${{ github.event.issue.number }}"
          fi

          # Extraer rutas de archivos
          FILES=$(echo "$BODY" | grep -oP 'Archivo:\s*\K.+')
          
          if [ -z "$FILES" ]; then
            echo "❌ No se encontraron rutas válidas en el cuerpo."
            exit 1
          fi

          # Procesar cada archivo encontrado
          for FILE in $FILES; do
            CLEAN_FILE=$(echo "$FILE" | tr -d '\r')
            # Generar un ID único por archivo
            ID="${ISSUE_NUM}_$(echo "$CLEAN_FILE" | md5sum | cut -c1-8)"
            
            # Crear el archivo JSON en la cola
            echo "{\"file\": \"$CLEAN_FILE\", \"issue\": $ISSUE_NUM, \"status\": \"pending\"}" > ".github/ai_queue/req_$ID.json"
            echo "✅ Encolado correctamente: $CLEAN_FILE"
          done

      - name: 🚀 Push a la Cola
        run: |
          git config user.name "Enque-got"
          git config user.email "actions@github.com"
          git add .github/ai_queue/
          # Bypass de Copilot mediante tag [IGNORE-BOT]
          git commit -m "queue: register documentation task [IGNORE-BOT]" || echo "Sin cambios"
          git push