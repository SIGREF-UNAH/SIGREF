name: "Actor 1: Enqueue Documentation"

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Número de la Issue asociada'
        required: true
        default: '0'
      issue_body:
        description: 'Cuerpo (debe incluir "Archivo: ruta/del/archivo")'
        required: true

jobs:
  enqueue:
    if: github.event.label.name == 'generar-docs' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 📝 Registrar en Cola Única (docs_queue.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .github/ai_queue
          QUEUE_FILE=".github/ai_queue/docs_queue.json"
          
          # Inicializar el array JSON si no existe
          if [ ! -f "$QUEUE_FILE" ]; then
            echo "[]" > "$QUEUE_FILE"
          fi

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BODY="${{ github.event.inputs.issue_body }}"
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
          else
            BODY="${{ github.event.issue.body }}"
            ISSUE_NUM="${{ github.event.issue.number }}"
          fi

          FILES=$(echo "$BODY" | grep -oP 'Archivo:\s*\K.+')
          
          if [ -z "$FILES" ]; then
            echo "❌ No se encontraron rutas válidas."
            exit 1
          fi

          # Revisar si hay un PR abierto de la rama estática para extraer qué archivos ya están en proceso
          PR_FILES=$(gh pr view docs/ia-batch-updates --json files -q '.files[].path' 2>/dev/null || echo "")

          for FILE in $FILES; do
            CLEAN_FILE=$(echo "$FILE" | tr -d '\r')
            
            # Condición 1: ¿Ya está en el PR abierto?
            if echo "$PR_FILES" | grep -q "^$CLEAN_FILE$"; then
              echo "⏭️ Omitiendo: $CLEAN_FILE ya está en un PR pendiente."
              continue
            fi
            
            # Condición 2: ¿Ya está en la cola actual?
            if grep -q "\"file\": \"$CLEAN_FILE\"" "$QUEUE_FILE"; then
              echo "⏭️ Omitiendo: $CLEAN_FILE ya está en la cola."
              continue
            fi

            # Agregar al array JSON usando jq
            jq ". += [{\"file\": \"$CLEAN_FILE\", \"issue\": $ISSUE_NUM}]" "$QUEUE_FILE" > tmp.json && mv tmp.json "$QUEUE_FILE"
            echo "✅ Encolado: $CLEAN_FILE"
          done

      - name: 🚀 Push de la Cola Actualizada
        run: |
          git config user.name "GeneriDocs-bot"
          git config user.email "actions@github.com"
          git add .github/ai_queue/docs_queue.json
          git commit -m "queue: update documentation queue [IGNORE-BOT]" || echo "Sin cambios nuevos para encolar"
          git push