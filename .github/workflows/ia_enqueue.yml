name: "Actor 1: Enqueue Documentation"

on:
  # 1. Disparador Automático: Al poner la etiqueta en una Issue
  issues:
    types: [labeled]
  
  # 2. Disparador Manual: Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Número de la Issue asociada'
        required: true
        default: '0'
      issue_body:
        description: 'Cuerpo (debe incluir "Archivo: ruta/del/archivo")'
        required: true

jobs:
  enqueue:
    # Se ejecuta si la etiqueta es la correcta O si se activa manualmente
    if: github.event.label.name == 'generar-docs' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 📝 Registrar en Cola (ai_queue)
        run: |
          mkdir -p .github/ai_queue
          
          # Lógica para seleccionar la fuente de datos (Manual vs Etiqueta)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BODY="${{ github.event.inputs.issue_body }}"
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
          else
            BODY="${{ github.event.issue.body }}"
            ISSUE_NUM="${{ github.event.issue.number }}"
          fi

          # Extracción de rutas mediante el patrón "Archivo: "[cite: 4]
          FILES=$(echo "$BODY" | grep -oP 'Archivo:\s*\K.+')
          
          if [ -z "$FILES" ]; then
            echo "❌ No se encontraron rutas válidas en el cuerpo."
            exit 1
          fi

          for FILE in $FILES; do
            CLEAN_FILE=$(echo $FILE | tr -d '\r')[cite: 4]
            # Generación de ID único para evitar colisiones[cite: 4]
            ID="${ISSUE_NUM}_$(echo $CLEAN_FILE | md5sum | cut -c1-8)"[cite: 4]
            
            # Creación del JSON de estado pendiente[cite: 4]
            echo "{\"file\": \"$CLEAN_FILE\", \"issue\": $ISSUE_NUM, \"status\": \"pending\"}" > ".github/ai_queue/req_$ID.json"[cite: 4]
            echo "✅ Encolado correctamente: $CLEAN_FILE"
          done

      - name: 🚀 Push a la Cola
        run: |
          git config user.name "Enque-got"[cite: 4]
          git config user.email "actions@github.com"[cite: 4]
          git add .github/ai_queue/[cite: 4]
          # Commit con tag de bypass para Copilot[cite: 4]
          git commit -m "queue: register documentation task [IGNORE-BOT]" || echo "Sin cambios"[cite: 4]
          git push[cite: 4]