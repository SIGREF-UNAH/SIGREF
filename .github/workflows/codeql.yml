name: CodeQL

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'BE/**'
      - 'FE/**'
      - '!FE/docs/**'
      - '!FE/documentation/**'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/**'
  push:
    branches: [main]
    paths:
      - 'BE/**'
      - 'FE/**'
      - '!FE/docs/**'
      - '!FE/documentation/**'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/**'
  schedule:
    - cron: '23 3 * * 1'

permissions:
  actions: read
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'BE/**'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
            frontend:
              - 'FE/**'
              - '!FE/docs/**'
              - '!FE/documentation/**'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'

  backend:
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL for C#
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          config-file: .github/codeql/config.yml
      - name: Analyze C#
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:csharp'

  frontend:
    if: github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL for JavaScript and TypeScript
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: .github/codeql/config.yml
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
