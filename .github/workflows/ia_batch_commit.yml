name: "Actor 3: Batch Commit & PR"

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  apply-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🚀 Procesar Lote (Actor 2)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm install --no-save @google/generative-ai
          node .github/scripts/batch_processor.js

      - name: 🛠️ Parsear Respuesta desde /tmp y Restaurar Archivos
        run: |
          node -e "
          const fs = require('fs');
          const path = '/tmp/raw_response.txt'; // Leyendo desde la carpeta temporal
          if (!fs.existsSync(path)) {
              console.log('No hay respuesta de IA para procesar.');
              process.exit(0);
          }
          const raw = fs.readFileSync(path, 'utf-8');
          const regex = /FILE_PATH:\s*(.*?)\nFIXED_CONTENT_START\n([\s\S]*?)\nFIXED_CONTENT_END/g;
          let match;
          while ((match = regex.exec(raw)) !== null) {
              const filePath = match[1].trim();
              const code = match[2].trim();
              if (fs.existsSync(filePath)) {
                  fs.writeFileSync(filePath, code, 'utf-8');
                  console.log('✅ Restaurado: ' + filePath);
              }
          }
          "

      - name: 🧹 Limpiar Cola (Reset docs_queue.json)
        run: |
          # Solo reiniciamos el arreglo JSON, nada de borrar archivos
          echo "[]" > .github/ai_queue/docs_queue.json
          git config user.name "GeneriDocs-bot"
          git config user.email "actions@github.com"
          git add .github/ai_queue/docs_queue.json
          git commit -m "clean: reset documentation queue [IGNORE-BOT]" || echo "Cola ya limpia"

      - name: 🔀 Crear o Actualizar Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: "GeneriDocs-bot <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "GeneriDocs-bot <41898282+github-actions[bot]@users.noreply.github.com>"
          commit-message: "docs: batch documentation updates [ia-documentation] [IGNORE-BOT]"
          title: "🤖 Docs: Batch Update [ia-documentation]"
          body: |
            ## 📝 Documentación técnica autogenerada
            Este PR se actualiza automáticamente con los lotes encolados.
          branch: "docs/ia-batch-updates" # NOMBRE DE RAMA ESTÁTICO (Evita duplicar PRs)
          base: main
          labels: "documentation, ia-documentation"
          delete-branch: true
          draft: true