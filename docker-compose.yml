# ============================================================================
# MÓDULO: Orquestación Maestra de Producción (Full Stack)
# PROYECTO: SIGREF
# ----------------------------------------------------------------------------
# AUTORES (GitHub): 
#   - @erickArita (Erick Marley Arita)
#   - @TETvega (Héctor Rene Martínez Vega)
# CO-AUTOR DE OPTIMIZACIÓN Y VALIDACIÓN: 
#   - Gemini 3 Flash (Google AI)
# ----------------------------------------------------------------------------
# PROPÓSITO: Despliegue integral de microservicios, telemetría (OTEL/Seq) 
#            y seguridad perimetral (Nginx).
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PERÍMETRO Y SEGURIDAD
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/sites/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - keycloak
      - sigref-api
      - hapifhir  # Añadido: Nginx debe esperar a HAPI si expones rutas FHIR
      - frontend
    networks:
      - sigref-network
    expose:
      - "80"
    restart: "always"

  # --------------------------------------------------------------------------
  # OBSERVABILIDAD Y TELEMETRÍA
  # --------------------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_ADMIN_PASSWORD}"
      SEQ_API_CANONICALURI: "${SEQ_CANONICAL_URI:-http://localhost:5341}"
    volumes:
      - seq-data:/data
    expose:
      - "5341"
      - "80"
    networks:
      - sigref-network
    restart: "always"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - seq
    networks:
      - sigref-network
    restart: "always"

  # --------------------------------------------------------------------------
  # PERSISTENCIA
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigref_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigref_user}" ]
      interval: 10s
      retries: 5
    networks:
      - sigref-network

  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-mongo_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
    networks:
      - sigref-network

  # --------------------------------------------------------------------------
  # SERVICIOS DE APLICACIÓN
  # --------------------------------------------------------------------------
  keycloak:
    build:
      context: ./BE/SIGREF.API.AppHost/config
      dockerfile: Keycloak.Dockerfile
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: "${KC_HOSTNAME_URL:-https://localhost/auth}"
      KC_PROXY_HEADERS: "xforwarded"
      OTEL_SERVICE_NAME: "keycloak"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    command: start --import-realm
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - sigref-network

  # NUEVO: Reintegración de HAPI FHIR
  hapifhir:
    image: hapiproject/hapi:latest
    environment:
      spring.datasource.url: jdbc:postgresql://postgres:5432/hapi
      spring.datasource.username: ${POSTGRES_USER}
      spring.datasource.password: ${POSTGRES_PASSWORD}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.fhir_version: R4
      # Telemetría para Java
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_SERVICE_NAME: "hapi-fhir"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks:
      - sigref-network
    expose:
      - "8080"

  sigref-api:
    build:
      context: ./BE
      dockerfile: SIGREF.API/Dockerfile
    environment:
      ConnectionStrings__sigref: Host=postgres;Database=sigref;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__MongoDb: mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongodb:27017
      HAPIFHIR_HTTP: http://hapifhir:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "sigref-api"
    depends_on:
      postgres: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      hapifhir: { condition: service_started } # Asegura que HAPI esté arriba antes que la API
    networks:
      - sigref-network

  hangfire-worker:
    build:
      context: ./BE
      dockerfile: SIGREF.Hangfire.Worker/Dockerfile
    environment:
      ConnectionStrings__hangfire: Host=postgres;Database=hangfire;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      OTEL_SERVICE_NAME: "sigref-hangfire-worker"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - sigref-network

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    depends_on:
      - sigref-api
    networks:
      - sigref-network

# ----------------------------------------------------------------------------
# RECURSOS GLOBALES
# ----------------------------------------------------------------------------
volumes:
  postgres-data:
  mongodb-data:
  seq-data:

networks:
  sigref-network:
    driver: bridge