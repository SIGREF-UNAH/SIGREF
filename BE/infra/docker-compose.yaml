# ============================================================================
# CAMBIOS APLICADOS (Codex, 2026-09-17)
# - Los puertos se mantienen solo en la red interna con `expose`.
# - Las credenciales siguen llegando por variables de entorno; use .env.example
#   como plantilla local y un gestor de secretos en despliegues reales.
# - Se anaden healthchecks y reinicio controlado a servicios con estado.
# ============================================================================

services:
  env-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    expose:
      - "18888"
      - "18889"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/postgres:17"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "postgres"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    expose:
      - "5432"
    volumes:
      - type: "bind"
        target: "/var/lib/postgresql/data"
        source: "/home/erick/Desktop/unah/SIGREF/BE/SIGREF.API.AppHost/data/postgres"
        # El script de inicializacion no debe ser modificable desde el contenedor.
        read_only: true
      - type: "bind"
        target: "/docker-entrypoint-initdb.d/init-db.sql"
        source: "/home/erick/Desktop/unah/SIGREF/BE/SIGREF.API.AppHost/config/init-db.sql"
        read_only: false
    networks:
      - "aspire"
    restart: unless-stopped
  mongo-sigref-logs:
    image: "docker.io/library/mongo:8.2"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGODB_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD}"
    expose:
      - "27017"
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - type: "bind"
        target: "/data/db"
        source: "/home/erick/Desktop/unah/SIGREF/BE/SIGREF.API.AppHost/data/mongo-sigref-logs"
        read_only: false
    networks:
      - "aspire"
    restart: unless-stopped
  keycloak:
    image: "quay.io/keycloak/keycloak:26.4"
    command:
      - "start"
      - "--import-realm"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_USER}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_PASS}"
      KC_HEALTH_ENABLED: "true"
      ConnectionStrings__keycloakDb: "Host=postgres;Port=5432;Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD};Database=keycloak"
      KEYCLOAKDB_HOST: "postgres"
      KEYCLOAKDB_PORT: "5432"
      KEYCLOAKDB_USERNAME: "${POSTGRES_USERNAME}"
      KEYCLOAKDB_PASSWORD: "${POSTGRES_PASSWORD}"
      KEYCLOAKDB_URI: "postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/keycloak"
      KEYCLOAKDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/keycloak"
      KEYCLOAKDB_DATABASE: "keycloak"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: "/keycloak"
    expose:
      - "8080"
      - "9000"
    depends_on:
      postgres:
        condition: "service_healthy"
    networks:
      - "aspire"
    restart: unless-stopped
  hapi-fhir:
    image: "hapiproject/hapi:latest"
    environment:
      ConnectionStrings__postgres: "Host=postgres;Port=5432;Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_URI: "postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432"
      POSTGRES_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432"
      ConnectionStrings__hapi: "Host=postgres;Port=5432;Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD};Database=hapi"
      HAPI_HOST: "postgres"
      HAPI_PORT: "5432"
      HAPI_USERNAME: "${POSTGRES_USERNAME}"
      HAPI_PASSWORD: "${POSTGRES_PASSWORD}"
      HAPI_URI: "postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/hapi"
      HAPI_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/hapi"
      HAPI_DATABASE: "hapi"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/hapi"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect"
    expose:
      - "8080"
    volumes:
      - type: "bind"
        target: "/app/config/application.yaml"
        source: "/home/erick/Desktop/unah/SIGREF/BE/SIGREF.API.AppHost/config/hapi.application.yaml"
        read_only: false
    depends_on:
      postgres:
        condition: "service_healthy"
    networks:
      - "aspire"
    restart: unless-stopped
  sigref-api:
    image: "${SIGREF_API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SIGREF_API_PORT}"
      ConnectionStrings__hapi: "Host=postgres;Port=5432;Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD};Database=hapi"
      HAPI_HOST: "postgres"
      HAPI_PORT: "5432"
      HAPI_USERNAME: "${POSTGRES_USERNAME}"
      HAPI_PASSWORD: "${POSTGRES_PASSWORD}"
      HAPI_URI: "postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/hapi"
      HAPI_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/hapi"
      HAPI_DATABASE: "hapi"
      ConnectionStrings__sigref: "Host=postgres;Port=5432;Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD};Database=sigref"
      SIGREF_HOST: "postgres"
      SIGREF_PORT: "5432"
      SIGREF_USERNAME: "${POSTGRES_USERNAME}"
      SIGREF_PASSWORD: "${POSTGRES_PASSWORD}"
      SIGREF_URI: "postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/sigref"
      SIGREF_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/sigref"
      SIGREF_DATABASE: "sigref"
      ConnectionStrings__sigref-logs: "mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongo-sigref-logs:27017/sigref-logs?authSource=admin&authMechanism=SCRAM-SHA-256"
      SIGREF-LOGS_HOST: "mongo-sigref-logs"
      SIGREF-LOGS_PORT: "27017"
      SIGREF-LOGS_USERNAME: "${MONGODB_USER}"
      SIGREF-LOGS_PASSWORD: "${MONGODB_PASSWORD}"
      SIGREF-LOGS_AUTHENTICATIONDATABASE: "admin"
      SIGREF-LOGS_AUTHENTICATIONMECHANISM: "SCRAM-SHA-256"
      SIGREF-LOGS_URI: "mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongo-sigref-logs:27017/sigref-logs?authSource=admin&authMechanism=SCRAM-SHA-256"
      SIGREF-LOGS_DATABASE: "sigref-logs"
      KEYCLOAK_HTTP: "http://keycloak:8080"
      services__keycloak__http__0: "http://keycloak:8080"
      KEYCLOAK_MANAGEMENT: "http://keycloak:9000"
      services__keycloak__management__0: "http://keycloak:9000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "sigref-api"
    expose:
      - "${SIGREF_API_PORT}"
    networks:
      - "aspire"
    # Aislamiento compatible con .NET: sin capacidades Linux adicionales.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
  gateway:
    image: "mcr.microsoft.com/dotnet/nightly/yarp:2.3.0-preview.4"
    command:
      - "/app/yarp.dll"
    entrypoint:
      - "dotnet"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      SIGREF-API_HTTP: "http://sigref-api:${SIGREF_API_PORT}"
      REVERSEPROXY__ROUTES__route0__MATCH__PATH: "/api/{**catch-all}"
      REVERSEPROXY__ROUTES__route0__CLUSTERID: "cluster_sigref-api"
      REVERSEPROXY__ROUTES__route0__TRANSFORMS__0__PathRemovePrefix: "/api"
      REVERSEPROXY__ROUTES__route1__MATCH__PATH: "/keycloak/{**catch-all}"
      REVERSEPROXY__ROUTES__route1__CLUSTERID: "cluster_keycloak"
      REVERSEPROXY__ROUTES__route2__MATCH__PATH: "/hapi/fhir/{**catch-all}"
      REVERSEPROXY__ROUTES__route2__CLUSTERID: "cluster_hapi-fhir"
      REVERSEPROXY__ROUTES__route2__TRANSFORMS__0__PathRemovePrefix: "/hapi"
      REVERSEPROXY__CLUSTERS__cluster_sigref-api__DESTINATIONS__destination1__ADDRESS: "http://_http.sigref-api"
      REVERSEPROXY__CLUSTERS__cluster_keycloak__DESTINATIONS__destination1__ADDRESS: "http://keycloak"
      REVERSEPROXY__CLUSTERS__cluster_hapi-fhir__DESTINATIONS__destination1__ADDRESS: "http://hapi-fhir"
      services__sigref-api__http__0: "http://sigref-api:${SIGREF_API_PORT}"
      KEYCLOAK_HTTP: "http://keycloak:8080"
      services__keycloak__http__0: "http://keycloak:8080"
      KEYCLOAK_MANAGEMENT: "http://keycloak:9000"
      services__keycloak__management__0: "http://keycloak:9000"
      HAPI-FHIR_HTTP: "http://hapi-fhir:8080"
      services__hapi-fhir__http__0: "http://hapi-fhir:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "gateway"
    expose:
      - "5000"
    networks:
      - "aspire"
    restart: unless-stopped
networks:
  aspire:
    driver: "bridge"
