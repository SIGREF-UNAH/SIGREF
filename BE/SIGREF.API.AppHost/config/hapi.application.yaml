# ============================================================================
# MÓDULO: Configuración de Servidor HAPI FHIR JPA
# PROYECTO: SIGREF
# ----------------------------------------------------------------------------
# AUTORES: 
#   - @TETvega (Héctor Rene Martínez Vega) -> Arquitectura y lógica clínica
#   - @erickArita (Erick Marley Arita) -> Base de infraestructura
# CO-AUTOR DE OPTIMIZACIÓN: 
#   - Gemini 3 Flash (Google AI) -> Ajustes de performance y batching
# ----------------------------------------------------------------------------
# PROPÓSITO: Configuración optimizada de persistencia HL7 FHIR R4 para 
#            entornos hospitalarios de alta disponibilidad.
# ============================================================================

spring:
  datasource:
    # ============================================================
    # CONFIGURACIÓN DE DATA SOURCE (SPRING BOOT)
    # ============================================================
    # Define cómo el servidor JPA gestiona el pool de conexiones a la DB.
    # Ref Oficial: https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.datasource.configuration
    
    # Driver JDBC requerido para PostgreSQL. Crucial para inicializar el pool HikariCP.
    driverClassName: org.postgresql.Driver

  jpa:
    hibernate:
      # ============================================================
      # CONTROL DE ESQUEMA (HIBERNATE)
      # ============================================================
      # 'validate': Hibernate solo verifica que las tablas existan.
      # Evita cambios accidentales en la estructura de datos médicos.
      # Ref: https://docs.jboss.org/hibernate/orm/current/userguide/html_single/#schema-generation
      ddl-auto: validate

    properties:
      # ============================================================
      # DIALECTO HAPI FHIR PARA POSTGRESQL
      # ============================================================
      # Utiliza un dialecto especializado para índices GIN/GIST y estructuras FHIR.
      # Código: https://github.com/hapifhir/hapi-fhir/blob/master/hapi-fhir-jpa/src/main/java/ca/uhn/fhir/jpa/model/dialect/HapiFhirPostgresDialect.java
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect

      # ============================================================
      # LOGGING Y TRAZABILIDAD SQL
      # ============================================================
      # Desactivar en producción para proteger PHI (Protected Health Information)
      # y ahorrar ciclos de CPU en el formateo de strings.
      hibernate.format_sql: false
      hibernate.show_sql: false

      # ============================================================
      # OPTIMIZACIÓN DE BATCHING (RENDIMIENTO)
      # ============================================================
      # HAPI FHIR genera múltiples inserciones por cada recurso (tags, indices, string data).
      # El batching reduce drásticamente los round-trips de red.
      # Ref: https://docs.hibernate.org/orm/current/userguide/html_single/#batch
      
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      
      # Optimización adicional para PostgreSQL: permite reescribir sentencias batch.
      # Nota: Se debe asegurar que el parámetro 'reWriteBatchedInserts=true' esté en la URL JDBC.
      hibernate.jdbc.lob.non_contextual_creation: true

  transaction:
    # ============================================================
    # TIMEOUT DE TRANSACCIONES
    # ============================================================
    # 60 segundos es el balance ideal para permitir búsquedas complejas (Chain/Include)
    # sin bloquear indefinidamente las tablas en caso de error.
    default-timeout: 60

# ============================================================
# HAPI FHIR – JPA SERVER CONFIGURATION
# ============================================================
hapi:
  # Ref Oficial: https://hapifhir.io/hapi-fhir/docs/server_jpa/configuration.html
  fhir:
    # ============================================================
    # VERSIÓN FHIR
    # ============================================================
    # R4 (R4B) es el estándar actual para interoperabilidad internacional.
    fhir_version: R4

    # ============================================================
    # SEGURIDAD Y CONSISTENCIA DE REFERENCIAS
    # ============================================================
    # Garantiza que el servidor sea una fuente de verdad confiable y aislada.
    
    # Bloquea referencias a servidores externos (Previene fugas de datos y dependencias externas).
    allow_external_references: false
    # Obliga a que cada referencia apunte a un recurso real en este servidor.
    allow_placeholder_references: false
    # Integración referencial forzada en escritura y borrado (Crucial para integridad clínica).
    enforce_referential_integrity_on_write: true
    enforce_referential_integrity_on_delete: true

    # ============================================================
    # CACHE DE BÚSQUEDAS FHIR
    # ============================================================
    # Reutiliza el conjunto de resultados (SearchSet) por 6 segundos.
    # Mitiga el impacto de refrescos accidentales o consultas repetitivas de UI.
    reuse_cached_search_results_millis: 6000

    # ============================================================
    # PAGINACIÓN DE RESULTADOS (BUNDLES)
    # ============================================================
    default_page_size: 20
    max_page_size: 200

    # ============================================================
    # UI / FHIR TESTER
    # ============================================================
    # El módulo 'Tester' se deshabilita por seguridad en producción.
    # Ref: https://hapifhir.io/hapi-fhir/docs/server_jpa/ui_and_tester.html
    tester:
      - enabled: false

# ----------------------------------------------------------------------------
# NOTAS ADICIONALES PARA POSTGRESQL:
# - Asegurarse de que las extensiones 'pg_trgm' y 'unaccent' estén instaladas
#   en la base de datos 'hapi' para búsquedas de texto eficientes.
# ----------------------------------------------------------------------------