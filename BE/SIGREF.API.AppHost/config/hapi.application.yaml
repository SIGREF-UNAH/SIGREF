spring:
  datasource:

    # ============================================================
    # CONFIGURACIÓN DE DATA SOURCE (SPRING BOOT)
    # ============================================================
    # Esta sección pertenece a Spring Boot y NO a HAPI FHIR.
    # Define cómo el servidor JPA se conecta a la base de datos.
    #
    # Documentación oficial:
    # https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.datasource.configuration
    #
    # En entornos de producción hospitalaria:
    # - NUNCA se usa H2
    # - SIEMPRE se usa PostgreSQL o MySQL externos
    # - Normalmente estas propiedades se inyectan por variables de entorno
    #   (Docker / Kubernetes / CI-CD)
    #
    # Ejemplo:
    # url: jdbc:postgresql://postgres:5432/hapi
    # username: hapi
    # password: ********
    #

    # Driver JDBC requerido para PostgreSQL.
    # Permite a Spring inicializar correctamente el pool de conexiones.
    driverClassName: org.postgresql.Driver


  jpa:
    hibernate:

      # ============================================================
      # CONTROL DE ESQUEMA (HIBERNATE)
      # ============================================================
      # validate:
      # - Hibernate SOLO valida que las tablas existen
      # - NO crea
      # - NO modifica
      # - NO elimina
      #
      # Esta es la única opción segura en producción.
      #
      # create / update / create-drop:
      #  PELIGROSO en producción
      #  Puede destruir datos clínicos
      ddl-auto: validate


    properties:

      # ============================================================
      # DIALECTO HAPI FHIR PARA POSTGRESQL
      # ============================================================
      # HAPI FHIR NO utiliza el dialecto estándar de Hibernate.
      # Usa un dialecto propio optimizado para:
      # - Estructura interna de recursos FHIR
      # - Índices compuestos
      # - Tipos específicos usados por el JPA Server
      #
      # Código fuente oficial:
      # https://github.com/hapifhir/hapi-fhir/blob/master/hapi-fhir-jpa/src/main/java/ca/uhn/fhir/jpa/model/dialect/HapiFhirPostgresDialect.java
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect


      # ============================================================
      # LOGGING SQL
      # ============================================================
      # Desactiva formateo de SQL.
      # Reduce uso de CPU y tamaño de logs.
      hibernate.format_sql: false

      # No imprime SQL en logs.
      # Importante por:
      # - Rendimiento
      # - Seguridad (datos sensibles)
      hibernate.show_sql: false


      # ============================================================
      # OPTIMIZACIÓN DE BATCHING (RENDIMIENTO)
      # ============================================================
      # Estas propiedades son estándar de Hibernate y MUY IMPORTANTES
      # para HAPI FHIR, ya que el JPA Server genera múltiples inserts
      # internos por cada recurso FHIR persistido.
      #
      # Documentación oficial:
      # https://docs.hibernate.org/orm/current/userguide/html_single/#batch

      # Número de operaciones INSERT/UPDATE enviadas en un solo batch.
      # Reduce round-trips a la base de datos.
      hibernate.jdbc.batch_size: 50

      # Agrupa INSERTs por tipo de entidad.
      # Mejora eficiencia y reduce locks.
      hibernate.order_inserts: true

      # Agrupa UPDATEs por tipo de entidad.
      # Reduce deadlocks en concurrencia.
      hibernate.order_updates: true


  transaction:
    # ============================================================
    # TIMEOUT DE TRANSACCIONES
    # ============================================================
    # Tiempo máximo (segundos) que una transacción puede permanecer activa.
    # Previene bloqueos prolongados en:
    # - Escrituras concurrentes
    # - Procesos batch
    default-timeout: 60


# ============================================================
# HAPI FHIR – JPA SERVER CONFIGURATION
# ============================================================
hapi:
  # Documentación oficial:
  # https://hapifhir.io/hapi-fhir/docs/server_jpa/configuration.html

  fhir:

    # ============================================================
    # VERSIÓN FHIR
    # ============================================================
    # Versión del estándar HL7 FHIR que expone el servidor.
    #
    # R4 es:
    # - La más estable
    # - La más usada en producción
    # - Compatible con la mayoría de perfiles nacionales
    fhir_version: R4


    # ============================================================
    # SEGURIDAD Y CONSISTENCIA DE REFERENCIAS
    # ============================================================
    # Estas opciones controlan cómo los recursos FHIR se relacionan
    # entre sí (Patient, Practitioner, Organization, etc.).

    # No permite referencias absolutas externas:
    # Ej: http://otro-servidor/fhir/Patient/123
    #
    # Recomendado para:
    # - Hospitales
    # - Entornos cerrados
    # - Integraciones controladas
    allow_external_references: false

    # No permite referencias placeholder (vacías o temporales).
    # Obliga a que todas las referencias sean válidas y persistentes.
    allow_placeholder_references: false

    # Verifica integridad referencial al escribir recursos.
    # Ej: un Encounter no puede apuntar a un Patient inexistente.
    enforce_referential_integrity_on_write: true

    # Verifica integridad referencial al eliminar recursos.
    # Evita borrar recursos aún referenciados por otros.
    enforce_referential_integrity_on_delete: true


    # ============================================================
    # CACHE DE BÚSQUEDAS FHIR
    # ============================================================
    # Tiempo (en milisegundos) que se reutilizan resultados
    # de búsquedas idénticas.
    #
    # Reduce carga sobre:
    # - PostgreSQL
    # - Lucene embebido
    #
    # 6000 ms = 6 segundos
    reuse_cached_search_results_millis: 6000


    # ============================================================
    # PAGINACIÓN DE RESULTADOS
    # ============================================================
    # Controla cuántos recursos FHIR se devuelven por búsqueda.

    # Tamaño de página por defecto.
    default_page_size: 20

    # Tamaño máximo permitido.
    # Evita consultas abusivas o clientes mal configurados.
    max_page_size: 200


    # ============================================================
    # UI / FHIR TESTER
    # ============================================================
    # El FHIR Tester es útil SOLO en desarrollo.
    #
    # En producción:
    # - Expone endpoints
    # - Permite consultas arbitrarias
    # - Representa un riesgo de seguridad
    #
    # Por ello se desactiva explícitamente.
    tester:
      - enabled: false
