# ===========================================================
# SIGREF Custom Theme Configuration
# ===========================================================

# Heredamos la base visual por defecto de Keycloak
parent=base

# Importamos estilos y componentes comunes
import=common/keycloak

# Tipo de tema que personalizamos (login)
types=login

# Archivos CSS adicionales que se cargarán en las vistas
styles=css/style.css

# ===========================================================
# Clases personalizadas para integrarse con tu CSS
# ===========================================================
kcButtonClass=btn
kcButtonPrimaryClass=btn btn-primary
kcButtonLargeClass=btn btn-large
kcLabelClass=label
kcInputClass=form-input
kcFormClass=login-form

# ===========================================================
# Configuración de caché (solo en desarrollo)
# ===========================================================
cacheThemes=false
cacheTemplates=false

# ===========================================================
# Identificación del tema
# ===========================================================
displayName=SIGREF Theme
