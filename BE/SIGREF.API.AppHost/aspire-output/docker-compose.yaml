# ============================================================================
# MÓDULO: Orquestación de Servicios SIGREF
# PROYECTO: SIGREF (Aspire Orchestration)
# ----------------------------------------------------------------------------
# AUTORES (GitHub): 
#   - @erickArita (Erick Marley Arita)
#   - @TETvega (Héctor Rene Martínez Vega)
# CO-AUTOR DE OPTIMIZACIÓN: 
#   - Gemini 3 Flash (Google AI)
# ----------------------------------------------------------------------------
# PROPÓSITO: Definición de red, volúmenes y variables de entorno para 
#            el despliegue integrado de la arquitectura SIGREF.
# ============================================================================

services:
  # DASHBOARD DE ASPIRE: Centraliza logs y telemetría (OpenTelemetry)
  env-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    expose:
      - "18888" # Dashboard UI
      - "18889" # OTLP Ingest
    networks:
      - "aspire"
    restart: "always"

  # BASE DE DATOS PRINCIPAL: Postgres 17 sobre Alpine (Ligero)
  postgres:
    image: "docker.io/postgres:17-alpine"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "postgres"
    healthcheck: # OPTIMIZACIÓN: Permite que otros servicios esperen a que la DB esté lista de verdad
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    volumes:
      - type: "volume"
        source: "data-postgres"
        target: "/var/lib/postgresql/data"
    networks:
      - "aspire"

  # BASE DE DATOS DE LOGS: MongoDB 8.2
  mongo-sigref-logs:
    image: "docker.io/library/mongo:8.2"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGODB_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD}"
    expose:
      - "27017"
    volumes:
      - type: "volume"
        source: "data-mongo-sigref-logs"
        target: "/data/db"
    networks:
      - "aspire"

  # IDENTITY SERVER: Keycloak (Usa la imagen optimizada que creamos)
  keycloak:
    image: "${KEYCLOAK_IMAGE}"
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_USER}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_PASS}"
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: "${POSTGRES_USERNAME}"
      KC_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
    depends_on:
      postgres:
        condition: "service_healthy" # Espera a que la DB pase el healthcheck
    networks:
      - "aspire"

  # SERVIDOR FHIR: Datos clínicos interoperables
  hapifhir:
    image: "hapiproject/hapi:latest"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/hapi"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect"
    depends_on:
      postgres:
        condition: "service_healthy"
    networks:
      - "aspire"

  # API PRINCIPAL: .NET 9 con OpenTelemetry
  sigref-api:
    image: "${SIGREF_API_IMAGE}"
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SIGREF_API_PORT}"
      # Inyección de Connection Strings para .NET
      ConnectionStrings__sigref: "Host=postgres;Database=sigref;Username=${POSTGRES_USERNAME};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__sigref-logs: "mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongo-sigref-logs:27017/sigref-logs?authSource=admin"
      # Configuración de Telemetría hacia el Dashboard de Aspire
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_SERVICE_NAME: "sigref-api"
      KEYCLOAK_HTTP: "http://keycloak:8080"
      HAPIFHIR_HTTP: "http://hapifhir:8080"
    ports:
      - "${SIGREF_API_PORT}:${SIGREF_API_PORT}"
    depends_on:
      postgres: { condition: "service_healthy" }
      mongo-sigref-logs: { condition: "service_started" }
      hapifhir: { condition: "service_started" }
      keycloak: { condition: "service_started" }
    networks:
      - "aspire"

  # FRONTEND: Aplicación de usuario final
  frontend:
    image: "${FRONTEND_IMAGE}"
    ports:
      - "5173:80"
    depends_on:
      sigref-api: { condition: "service_started" }
    networks:
      - "aspire"

networks:
  aspire:
    driver: "bridge"

volumes:
  data-postgres:
  data-mongo-sigref-logs:

# ----------------------------------------------------------------------------
# REFERENCIAS:
# - Docker Compose Specification: https://docs.docker.com/compose/compose-file/
# - .NET Aspire Deployment: https://learn.microsoft.com/en-us/dotnet/aspire/deployment/overview
# ============================================================================